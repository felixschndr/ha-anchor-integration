name: Run tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest --cov=custom_components/anchor --cov-report=term-missing --cov-report=json

      - name: Check coverage
        run: poetry run python scripts/checks/check_coverage.py

  # The integration in a real Home Assistant core (pytest-homeassistant-custom-component) against a real Anchor server.
  # The Anchor version is pinned in tests/e2e/docker-compose.yml; Dependabot opens a PR for every Anchor release.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Start Anchor
        run: docker compose -f tests/e2e/docker-compose.yml up -d

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Wait for Anchor
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:3999/api/health; do sleep 2; done'

      - name: Run end-to-end tests
        run: poetry run pytest tests/e2e -rs
        env:
          ANCHOR_E2E_URL: http://127.0.0.1:3999
