name: Run tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Run tests
        run: poetry run pytest --cov=custom_components/anchor --cov-report=term-missing --cov-report=json

      - name: Check coverage
        run: poetry run python scripts/checks/check_coverage.py

  # The integration in a real Home Assistant core (pytest-homeassistant-custom-component) against a real Anchor server.
  e2e:
    runs-on: ubuntu-latest
    services:
      anchor:
        # Deliberately unpinned as this job exists to notice when a new Anchor release breaks the integration.
        image: ghcr.io/zhfahim/anchor:latest
        ports:
          - 3000:3000
        env:
          PG_USER: anchor
          PG_PASSWORD: password
          PG_DATABASE: anchor
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.14"

      - name: Install Poetry
        run: pipx install poetry

      - name: Install dependencies
        run: poetry install --no-interaction --no-root

      - name: Wait for Anchor
        run: timeout 180 bash -c 'until curl -sf http://127.0.0.1:3000/api/health; do sleep 2; done'

      - name: Run end-to-end tests
        run: poetry run pytest tests/e2e -rs
        env:
          ANCHOR_E2E_URL: http://127.0.0.1:3000
